spring:
  application:
    name: word-encounter

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/word_encounter}
    username: ${DB_USERNAME:word_encounter}
    password: ${DB_PASSWORD:word_encounter}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  elasticsearch:
    uris: ${ELASTICSEARCH_URIS:http://localhost:9200}
    username: ${ELASTICSEARCH_USERNAME:}
    password: ${ELASTICSEARCH_PASSWORD:}

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://accounts.google.com

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000}
  security:
    google-client-id: ${GOOGLE_CLIENT_ID:}

server:
  port: ${SERVER_PORT:8080}

logging:
  level:
    org.springframework.security: INFO
