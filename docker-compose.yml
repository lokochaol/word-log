services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: word_encounter
      POSTGRES_USER: word_encounter
      POSTGRES_PASSWORD: word_encounter
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U word_encounter"]
      interval: 5s
      timeout: 5s
      retries: 10

  elasticsearch:
    # The backend uses Spring Data Elasticsearch with the official Elastic Java
    # client, which is not guaranteed compatible with OpenSearch's diverged API,
    # so this runs real Elasticsearch rather than OpenSearch.
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      xpack.security.http.ssl.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  elasticsearch_data:
