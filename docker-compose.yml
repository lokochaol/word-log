services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: word_encounter
      POSTGRES_USER: word_encounter
      POSTGRES_PASSWORD: word_encounter
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U word_encounter"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
